name: RPC Code Generator CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSYS2 and mbedTLS
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-mbedtls

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja

      - name: Build project
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Run code generator
        shell: msys2 {0}
        run: |
          ./build/app.exe proto/rpc.proto

      - name: Verify generated files
        shell: msys2 {0}
        run: |
          test -f output/UserRequest.h
          test -f output/UserRequest.c
          test -f output/UserResponse.h
          test -f output/UserResponse.c
          test -f output/UserService.h
          test -f output/UserService.cpp

      - name: Run TLS test
        shell: msys2 {0}
        run: |
          if [ -f build/test_tls.exe ]; then
            ./build/test_tls.exe
          else
            echo "TLS test executable not found"
            exit 1
          fi
