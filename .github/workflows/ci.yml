name: RPC Code Generator CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libmbedtls-dev

      - name: Configure project
        run: |
          rm -rf build
          cmake -S . -B build -G Ninja

      - name: Build project
        run: |
          cmake --build build

      - name: Run code generator
        run: |
          ./build/app proto/rpc.proto

      - name: Verify generated files
        run: |
          test -f output/UserRequest.h
          test -f output/UserRequest.c
          test -f output/UserResponse.h
          test -f output/UserResponse.c
          test -f output/UserService.h
          test -f output/UserService.cpp

          echo "All generated files exist."

      - name: Run TLS test
        run: |
          ./build/test_tls
